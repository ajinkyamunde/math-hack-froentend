server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  location /assets/ {
    expires 1y;
    # add_header here replaces the server-level ones, so repeat them.
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # Same-origin API traffic, including the live Server-Sent Events stream: session cookies stay first-party.
  # ${API_ORIGIN} is filled in from the container environment by the nginx image's template step.
  location /api/ {
    proxy_pass ${API_ORIGIN};
    proxy_ssl_server_name on;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
    client_max_body_size 3m;
  }

  location / {
    try_files $uri /index.html;
  }
}
